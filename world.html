<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bfdcf3;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #app canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/spectator/main.js"></script>
